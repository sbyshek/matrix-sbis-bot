services:
  # 🔹 Общий Redis для кэширования и сессий
  redis:
    build: ./infra/redis
    container_name: matrix-redis
    restart: unless-stopped
    env_file: .env
    logging:
      driver: json-file
      options:
        max-size: "20m"      # Макс. размер одного файла
        max-file: "5"        # Хранить последние 5 файлов (~100 МБ)
        compress: "true"     # Сжимать старые файлы (gzip)
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}  # ⚠️ Поменяй в .env или здесь
    profiles:
      - all
      - dev
      - prod 
      - bot
    volumes:
      - redis_data:/data
    networks:
      - matrix-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 🔹 VPN Bot (переехал в vpn_bot/)
  sbis-bot:
    build: ./sbis_bot
    container_name: matrix-vpn-bot
    env_file: ./sbis_bot/.env
    volumes:
      - ./sbis_bot/app:/app/app      # Live-reload
      - ./sbis_bot/data:/app/data    # Состояние
      - ./sbis_bot/logs:/app/logs    # Логи
    restart: unless-stopped
    profiles:
      - all
      - dev
      - prod 
      - bot
    logging:
      driver: json-file
      options:
        max-size: "20m"      # Макс. размер одного файла
        max-file: "5"        # Хранить последние 5 файлов (~100 МБ)
        compress: "true"     # Сжимать старые файлы (gzip)
    depends_on: [redis]
    networks: [matrix-net]

  # 🔹 Auto Bot (новый проект)
  auto-bot:
    build: ./auto_bot
    container_name: matrix-auto-bot
    env_file: ./auto_bot/.env
    volumes:
      - ./auto_bot/data:/app/data
      - ./auto_bot/app:/app/app     # Live-reload
      - ./auto_bot/logs:/app/logs   # Логи
      - ./auto_bot/matrix_store:/app/matrix_store
    restart: unless-stopped
    profiles:
      - auto
    logging:
      driver: json-file
      options:
        max-size: "20m"      # Макс. размер одного файла
        max-file: "5"        # Хранить последние 5 файлов (~100 МБ)
        compress: "true"     # Сжимать старые файлы (gzip)
    depends_on: [redis]
    networks: [matrix-net]

  registry-bot:
    build: ./registry_bot
    container_name: matrix-registry-bot
    env_file: ./registry_bot/.env
    volumes:
      - ./registry_bot/data:/app/data
      - ./registry_bot/app:/app/app
      - ./registry_bot/logs:/app/logs
    restart: unless-stopped
    profiles:
      - all
      - dev
      - prod 
      - bot
    logging:
      driver: json-file
      options:
        max-size: "20m"      # Макс. размер одного файла
        max-file: "5"        # Хранить последние 5 файлов (~100 МБ)
        compress: "true"     # Сжимать старые файлы (gzip)
    networks: [matrix-net]

  alert_api:
    build: ./alert_api
    container_name: matrix-alert-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"      # Макс. размер одного файла
        max-file: "5"        # Хранить последние 5 файлов (~100 МБ)
        compress: "true"     # Сжимать старые файлы (gzip)
    env_file: .env
    profiles:
      - all
      - dev
      - prod 
      - bot
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_KEY=${ADMIN_KEY}
    ports:
      - "8765:8000"  # ← Хост:Контейнер
    volumes:
      - ./alert_api/logs:/app/logs
      - ./alert_api/app:/app/app
      - ./alert_api/config:/app/config
      - ./alert_api/templates:/app/templates
    networks: [matrix-net]
    depends_on: [redis]

  alert_bot:
    build: ./alert_bot
    container_name: matrix-alert-bot
    env_file: ./alert_bot/.env
    environment:  
      - TIMEZONE=${TIMEZONE}
      - BOT_TOKEN=${BOT_TOKEN}
      - POLL_INTERVAL=${POLL_INTERVAL:-10}
      - TIMEZONE=${TIMEZONE:-Asia/Novosibirsk}  # Asia/Novosibirsk  
    volumes:
      - ./alert_bot/app:/app/app
      - ./alert_bot/data:/app/data
      - ./alert_bot/logs:/app/logs
      - ./alert_bot/config:/app/config
    restart: unless-stopped
    profiles:
      - all
      - dev
      - prod 
      - bot
    logging:
      driver: json-file
      options:
        max-size: "20m"      # Макс. размер одного файла
        max-file: "5"        # Хранить последние 5 файлов (~100 МБ)
        compress: "true"     # Сжимать старые файлы (gzip)
    networks: [matrix-net]
    depends_on: [alert_api, redis]

  canteen_api:
    build: ./canteen-api
    restart: unless-stopped
    env_file:
      - ./canteen-api/.env 
    environment:
      - REDIS_URL=redis://redis:6379/0  # Подключи к существующему Redis
    profiles:
      - all
      - dev
      - prod 
      - bot
    volumes:
      - ./canteen-api/config:/app/config
      - ./canteen-api:/app:ro
    ports:
      - "8766:8000"
    depends_on: 
      - redis
    networks:
      - matrix-net  # Та же сеть, что у nginx/fastapi


  task-api:
    build: ./task-manager/api          # Путь к папке с Dockerfile
    container_name: task_api
    restart: unless-stopped
    env_file: ./task-manager/.env      # Используем отдельный .env для этого модуля
    profiles:
      - all
      - dev
      - prod 
      - bot
    ports:
      - "8768:8000"                    # Проброс порта на хост
    volumes:
      - ./task-manager/data:/app/data  # Сохраняем SQLite базу на диске хоста
      - ./task-manager/api/app:/app/app    # Монтируем код для Hot-Reload (разработка)
    networks:
      - matrix-net                     # Подключаем к общей сети
    depends_on:
      - redis       
      
  voice-api:
    build: ./voice-api
    container_name: voice-api
    restart: unless-stopped
    env_file: ./voice-api/.env
    profiles:
      - all
      - dev
      - prod
      - voice  # ← Новый профиль для изолированного запуска
    ports:
      - "8769:8000"  # Эндпоинт для Asterisk curl
    volumes:
      - ./voice-api/app:/app/app      # Код (read-only для безопасности)
      - ./voice-api/data:/app/data       # Временные WAV файлы
      - ./voice-api/logs:/app/logs       # Логи приложения
      - ./voice-api/config:/app/config   # Конфигурационные файлы
    environment:
      - REDIS_URL=redis://redis:6379/3   # Явно указываем DB
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - matrix-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s                   # Ждем запуска Redis (убедись, что сервис называется redis)

  incident-dispatcher:
    build: ./incident-dispatcher
    container_name: incident-dispatcher
    restart: unless-stopped
    env_file: ./incident-dispatcher/.env  # Или ./incident-dispatcher/.env, если хочешь изолировать
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_URL=redis://redis:6379/4
    profiles:
      - all
      - dev
      - prod
    ports:
      - "8770:8000"
    volumes:
      - ./incident-dispatcher/app:/app/app      # Live-reload кода
      - ./incident-dispatcher/logs:/app/logs    # Логи
      - ./incident-dispatcher/config:/app/config # Для locations.json
      - ./incident-dispatcher/data:/app/data      # Аудиофайлы оповещений
      - ./incident-dispatcher/templates:/app/templates
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - matrix-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "true"


networks:
  matrix-net:
    driver: bridge

volumes:
  redis_data: