# Auto-generated from services.json — DO NOT EDIT MANUALLY
# Service: Весовой комплекс Тензо-M (битум) (tenzo-m)

location /tenzo-m/ {
    allow 192.168.168.58;
    allow 172.16.15.0/24;
    allow 172.17.15.0/24;
    deny all;

    proxy_pass http://172.17.20.69:8000/dashboard;
    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Стандартные заголовки
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /tenzo-m;

    # 🔥 ВАЖНО: отключаем gzip — иначе sub_filter не работает
    proxy_set_header Accept-Encoding "";

    # Подмена абсолютных путей в HTML/JS
    sub_filter_once off;
    sub_filter_types text/html application/javascript text/css application/json;
    
    # API endpoints
    sub_filter '"/api/' '"/tenzo-m/api/';
    sub_filter "'/api/" "'/tenzo-m/api/";
    sub_filter '=/api/' '=/tenzo-m/api/';
    sub_filter 'fetch("/api/' 'fetch("/tenzo-m/api/';
    sub_filter "fetch('/api/" "fetch('/tenzo-m/api/";
    
    # HTML pages
    sub_filter '"/dashboard"' '"/tenzo-m/dashboard"';
    sub_filter "'/dashboard'" "'/tenzo-m/dashboard'";
    sub_filter '"/admin"' '"/tenzo-m/admin"';
    sub_filter "'/admin'" "'/tenzo-m/admin'";
    sub_filter '"/readme"' '"/tenzo-m/readme"';
    sub_filter "'/readme'" "'/tenzo-m/readme'";
    sub_filter '"/car-history"' '"/tenzo-m/car-history"';
    sub_filter "'/car-history'" "'/tenzo-m/car-history'";
    sub_filter '"/analytics"' '"/tenzo-m/analytics"';
    sub_filter "'/analytics'" "'/tenzo-m/analytics'";
    sub_filter '"/weight-recommendations"' '"/tenzo-m/weight-recommendations"';
    sub_filter "'/weight-recommendations'" "'/tenzo-m/weight-recommendations'";
    
    # Weighing/accounting endpoints
    sub_filter '"/weighing' '"/tenzo-m/weighing';
    sub_filter "'/weighing" "'/tenzo-m/weighing";
    sub_filter '"/accounting' '"/tenzo-m/accounting';
    sub_filter "'/accounting" "'/tenzo-m/accounting";
    sub_filter '"/measures' '"/tenzo-m/measures';
    sub_filter "'/measures" "'/tenzo-m/measures";
    
    # Favicon
    sub_filter 'href="/favicon' 'href="/tenzo-m/favicon';
    sub_filter 'href="/static' 'href="/tenzo-m/static';

    # Redirects и cookies
    proxy_redirect / /tenzo-m/;
    proxy_cookie_path / /tenzo-m/;

    # Таймауты
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;
    client_max_body_size 50M;
}
