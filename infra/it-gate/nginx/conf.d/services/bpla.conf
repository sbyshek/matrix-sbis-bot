# Service: Консоль БПЛА (bpla)

location /bpla/ {
    allow 192.168.168.58;
    allow 172.17.15.15;
    deny all;

    proxy_pass http://172.17.80.10/;
    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Стандартные заголовки
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /bpla;

    # Исправляем редиректы приложения (Location: /login → /incident-dashboard/login)
    proxy_redirect / /bpla/;

    # Исправляем path в cookies
    proxy_cookie_path / /bpla/;

    # Таймауты
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;

    # Размер тела запроса (для загрузки файлов)
    client_max_body_size 50M;
}
