# Auto-generated from services.json — DO NOT EDIT MANUALLY
# Service: Поиск сотрудников (employee-search)

location /employee-search/ {
    # Открытый доступ

    proxy_pass http://172.17.20.69:8136/html/search/?q;
    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Стандартные заголовки
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /employee-search;

    # Исправляем редиректы приложения (Location: /login → /incident-dashboard/login)
    proxy_redirect / /employee-search/;

    # Исправляем path в cookies
    proxy_cookie_path / /employee-search/;

    #################################
    # 🔥 Подмена абсолютных путей на префиксные
    sub_filter_once off;
    sub_filter_types text/html application/javascript text/css;
    
    # Заменяем /static/... → /employee-search/static/...
    sub_filter 'href="/static/' 'href="/employee-search/static/';
    sub_filter 'src="/static/' 'src="/employee-search/static/';
    
    # Favicon
    sub_filter 'href="/favicon' 'href="/employee-search/favicon';
    sub_filter 'href="/static/favicon' 'href="/employee-search/static/favicon';
    
    # Прочие корневые ссылки (осторожно — может сломать, если внутри JS)
    sub_filter '="/api/' '="/employee-search/api/';
    
    # Заголовки для кэша
    proxy_set_header Accept-Encoding "";   # обязательно! sub_filter не работает с gzip
    #################################

    # Таймауты
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;

    # Размер тела запроса (для загрузки файлов)
    client_max_body_size 50M;
}
